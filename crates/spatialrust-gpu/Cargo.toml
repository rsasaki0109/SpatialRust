[package]
name = "spatialrust-gpu"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "GPU runtime and device buffers for SpatialRust"

[features]
default = []
gpu-wgpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
gpu-aoso-staging = ["gpu-wgpu", "spatialrust-core/tensor-aoso"]
gpu-image = ["gpu-wgpu", "dep:spatialrust-image"]
gpu-cuda = []

[dependencies]
spatialrust-core = { workspace = true }
spatialrust-math = { workspace = true }
spatialrust-search = { workspace = true }
spatialrust-image = { workspace = true, optional = true }
thiserror = { workspace = true }
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, optional = true }
pollster = { version = "0.4", optional = true }

[[bench]]
name = "voxel_pipeline"
harness = false
required-features = ["gpu-wgpu"]

[[bench]]
name = "voxel_segments"
harness = false
required-features = ["gpu-wgpu"]

[[bench]]
name = "aoso_frame_pipeline"
harness = false
required-features = ["gpu-aoso-staging"]

[[bench]]
name = "gpu_image_pipeline"
harness = false
required-features = ["gpu-image"]

[dev-dependencies]
criterion = { workspace = true }
spatialrust-vision = { workspace = true, default-features = false, features = ["imgproc-analysis"] }
rayon = { workspace = true }

[[bench]]
name = "image_histogram"
harness = false
required-features = ["gpu-image"]

[[example]]
name = "gpu_histogram"
required-features = ["gpu-image"]

[[bench]]
name = "image_cdf"
harness = false
required-features = ["gpu-image"]

[[example]]
name = "gpu_cdf"
required-features = ["gpu-image"]

[[bench]]
name = "image_equalize"
harness = false
required-features = ["gpu-image"]

[[example]]
name = "gpu_equalize"
required-features = ["gpu-image"]

[[example]]
name = "gpu_stage_timing"
required-features = ["gpu-image", "gpu-aoso-staging"]

[[example]]
name = "gpu_pool_reuse"
required-features = ["gpu-image"]

[package]
name = "spatialrust-pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Composable processing pipelines for SpatialRust"

[features]
default = ["pipeline-mvp"]
pipeline-mvp = []
pipeline-mvp-gpu = [
    "spatialrust-filtering/filter-voxel-gpu",
    "spatialrust-segmentation/segment-ransac-plane-gpu",
    "spatialrust-features/feature-normal-gpu",
    "spatialrust-segmentation/segment-euclidean-gpu",
]
pipeline-streaming = [
    "dep:spatialrust-records",
    "dep:spatialrust-io",
    "spatialrust-records/receipt-json",
]

[dependencies]
spatialrust-core = { workspace = true }
spatialrust-math = { workspace = true }
spatialrust-filtering = { workspace = true, features = ["filter-voxel"] }
spatialrust-features = { workspace = true, features = ["feature-normal"] }
spatialrust-segmentation = { workspace = true, features = ["segment-ransac-plane", "segment-euclidean"] }
spatialrust-registration = { workspace = true, features = [
    "register-icp",
    "register-icp-point-to-plane",
    "register-gicp",
] }
spatialrust-records = { workspace = true, optional = true }
spatialrust-io = { workspace = true, optional = true, features = ["streaming"] }

[dev-dependencies]
spatialrust-core = { workspace = true }
criterion = { workspace = true }

[[example]]
name = "bounded_voxel"
required-features = ["pipeline-streaming"]

[[bench]]
name = "mvp_xyzinormal"
harness = false

[[bench]]
name = "mvp_large_scale"
harness = false

[[bench]]
name = "mvp_composite_xyzirgb"
harness = false

[[bench]]
name = "mvp_xyzinormal_approximate_auto"
harness = false

[package]
name = "spatialrust-interchange"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "glTF and OpenUSD scene interchange adapters for SpatialRust"

[features]
default = []
gltf = []
openusd = []
tiles3d = []
tiles3d-copc = ["tiles3d", "dep:spatialrust-io", "dep:spatialrust-core"]
full = ["gltf", "openusd", "tiles3d", "tiles3d-copc"]

[dependencies]
spatialrust-scene.workspace = true
spatialrust-math.workspace = true
spatialrust-core = { workspace = true, optional = true }
spatialrust-io = { workspace = true, optional = true, features = ["io-copc"] }
thiserror.workspace = true

[package]
name = "spatialrust-viewer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native viewer state, controls, and debug overlays for SpatialRust"

[features]
default = []
serde = ["dep:serde", "spatialrust-math/serde", "spatialrust-viz/serde"]
native = ["dep:winit"]

[dependencies]
serde = { workspace = true, optional = true }
spatialrust-math = { workspace = true }
spatialrust-viz = { workspace = true }
thiserror.workspace = true
winit = { workspace = true, optional = true }

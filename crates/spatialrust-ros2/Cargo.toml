[package]
name = "spatialrust-ros2"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "ROS 2 message and rosbag2 adapters for SpatialRust"

[features]
default = []
# Read-only rosbag2 SQLite storage. Native rclrs executors remain out of scope.
rosbag2-sqlite = ["dep:rusqlite"]

[dependencies]
spatialrust-core.workspace = true
spatialrust-records.workspace = true
spatialrust-runtime = { workspace = true, default-features = false, features = ["ros2"] }
thiserror.workspace = true
rusqlite = { workspace = true, optional = true }

[dev-dependencies]
serde.workspace = true
serde_json.workspace = true
spatialrust-ai.workspace = true
spatialrust-distribute.workspace = true
spatialrust-io = { workspace = true, features = ["io-las", "streaming", "io-manifest", "storage-preflight"] }
spatialrust-interchange = { workspace = true, features = ["gltf"] }
spatialrust-mapping = { workspace = true, features = ["scan-icp"] }
spatialrust-math.workspace = true
spatialrust-registration = { workspace = true, features = ["register-icp"] }
spatialrust-scene.workspace = true
spatialrust-semantic.workspace = true
spatialrust-sync.workspace = true
spatialrust-tensor.workspace = true
spatialrust-viewer = { workspace = true, features = ["mapping", "scene", "semantic", "serde"] }
spatialrust-viz.workspace = true
tempfile.workspace = true

[[example]]
name = "rosbag2_to_las"
required-features = ["rosbag2-sqlite"]


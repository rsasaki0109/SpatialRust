name: Docs site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
      - name: Build the mobile AI camera playground
        shell: bash
        run: |
          cargo build -p spatialrust-web --release --target wasm32-unknown-unknown --features wasm,camera-tracking --locked
          wasm_bindgen_version=$(python scripts/wasm_bindgen_version.py Cargo.lock)
          cargo install wasm-bindgen-cli --version "$wasm_bindgen_version" --locked
          python scripts/build_camera_demo.py --output target/doc/camera --wasm target/wasm32-unknown-unknown/release/spatialrust_web.wasm
      - name: Add the project guide
        shell: bash
        run: |
          cp docs/site/index.html target/doc/index.html
          cp docs/site/algorithms.html target/doc/algorithms.html
          cp docs/site/vision2.html target/doc/vision2.html
          cp docs/site/styles.css target/doc/styles.css
          cargo run -q -p spatialrust --no-default-features --features platform --example vision_2_release_gate > target/doc/vision2-release.md
          cp docs/VISION_2_MIGRATION.md target/doc/vision2-migration.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

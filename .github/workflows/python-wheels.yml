name: Python wheels

on:
  push:
    tags: ["v*", "py-v*"]
    branches: [main]
    paths:
      - "crates/**"
      - "scripts/*.py"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  pull_request:
    paths:
      - "crates/**"
      - "scripts/*.py"
      - "Cargo.toml"
      - ".github/workflows/python-wheels.yml"
  workflow_dispatch:

concurrency:
  group: python-wheels-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  MANIFEST: crates/spatialrust-py/Cargo.toml

jobs:
  native-runtime:
    name: Native wheel runtime (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.8'
          - os: ubuntu-latest
            python: '3.14'
          - os: windows-latest
            python: '3.12'
          - os: macos-14
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/spatialrust-py
      - name: Build frozen default wheel
        run: |
          python -m pip install "maturin>=1.7,<2"
          python -m maturin build --release --locked --manifest-path crates/spatialrust-py/Cargo.toml --out native-dist
      - name: Install exact wheel and validate runtime
        shell: bash
        run: |
          python -m venv native-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wheel_python=native-venv/Scripts/python.exe
          else
            wheel_python=native-venv/bin/python
          fi
          "$wheel_python" -m pip install native-dist/*.whl numpy pytest pyarrow Pillow
          "$wheel_python" -m pytest crates/spatialrust-py/tests -o addopts='' -q --junitxml=native-tests.xml
          "$wheel_python" crates/spatialrust-py/tools/verify_installed_wheel.py native-dist/*.whl --junit native-tests.xml --receipt native-validation.json
      - name: Report native test failures in check annotations
        if: always()
        run: python scripts/report_junit_failures.py native-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-runtime-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            native-tests.xml
            native-validation.json
            native-dist/*.whl

  wheels:
    name: Build wheels (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          # abi3-py38: one wheel covers CPython 3.8+.
          args: --release --locked --manifest-path ${{ env.MANIFEST }} --out dist
          manylinux: auto
      - uses: actions/setup-python@v5
        if: matrix.target == 'x86_64'
        with:
          python-version: '3.12'
      - name: Install wheel in isolated environment and validate runtime
        if: matrix.target == 'x86_64'
        run: |
          python -m venv wheel-venv
          wheel-venv/bin/python -m pip install dist/*.whl numpy pytest pyarrow Pillow
          wheel-venv/bin/python -m pytest crates/spatialrust-py/tests -o addopts='' -q --junitxml=wheel-tests.xml
          wheel-venv/bin/python crates/spatialrust-py/tools/verify_installed_wheel.py dist/*.whl --junit wheel-tests.xml --receipt wheel-validation.json
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64' && always()
        with:
          name: wheel-runtime-validation
          path: |
            wheel-tests.xml
            wheel-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path ${{ env.MANIFEST }} --out dist
      - name: Rebuild source distribution and validate installed type information
        run: |
          python -m venv sdist-venv
          sdist-venv/bin/python -m pip install "maturin[patchelf]>=1.7,<2" numpy pytest pyarrow Pillow
          sdist-venv/bin/python - <<'PY'
          import pathlib, tarfile
          archives = list(pathlib.Path('dist').glob('*.tar.gz'))
          assert len(archives) == 1
          with tarfile.open(archives[0]) as archive:
              archive.extractall('sdist-source', filter='data')
          PY
          sdist-venv/bin/maturin build --release --locked --manifest-path sdist-source/*/spatialrust-py/Cargo.toml --out sdist-wheel
          sdist-venv/bin/python -m pip install sdist-wheel/*.whl
          sdist-venv/bin/python -m pytest crates/spatialrust-py/tests -o addopts='' -q --junitxml=sdist-tests.xml
          sdist-venv/bin/python crates/spatialrust-py/tools/verify_installed_wheel.py sdist-wheel/*.whl --junit sdist-tests.xml --receipt sdist-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sdist-runtime-validation
          path: |
            sdist-tests.xml
            sdist-validation.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Publishes to PyPI on tag pushes. Requires the MATURIN_PYPI_TOKEN secret;
  # the job is skipped on PRs and manual runs.
  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [wheels, sdist, native-runtime]
    if: startsWith(github.ref, 'refs/tags/')
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.MATURIN_PYPI_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*

name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  all-features:
    name: All features (clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The per-feature matrix tests each feature alone; this enforces clippy on
      # every feature-gated library module and that all features build and test
      # together. (`--lib` keeps the default-feature `--all-targets` clippy job as
      # the gate for tests/examples.) Runtime GPU tests need a wgpu adapter, so
      # the all-features job compiles them but does not execute them on GitHub's
      # GPU-less hosted runner.
      - run: cargo clippy --workspace --all-features --lib -- -D warnings
      - run: cargo test --workspace --all-features --no-run

  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace-default
            args: --workspace
          - name: spatialrust-serde
            args: -p spatialrust --features serde
          - name: spatialrust-records-receipt-json
            args: -p spatialrust-records --features receipt-json
          - name: spatialrust-records-receipt-json-meta
            args: -p spatialrust --features records-receipt-json
          - name: spatialrust-io-streaming-all
            args: -p spatialrust-io --no-default-features --features io-pcd,io-ply,io-las,io-laz,io-copc-http,streaming
          - name: spatialrust-pipeline-streaming
            args: -p spatialrust-pipeline --no-default-features --features pipeline-streaming
          - name: spatialrust-pipeline-streaming-meta
            args: -p spatialrust --no-default-features --features pipeline-streaming
          - name: spatialrust-streaming-cli
            args: -p spatialrust --no-default-features --features streaming-cli
          - name: spatialrust-io-pcd
            args: -p spatialrust-io --features io-pcd
          - name: spatialrust-io-pcd-meta
            args: -p spatialrust --features io-pcd
          - name: spatialrust-search-kdtree
            args: -p spatialrust-search --features search-kdtree
          - name: spatialrust-search-meta
            args: -p spatialrust --features search-kdtree
          - name: spatialrust-search-graph
            args: -p spatialrust-search --features search-graph
          - name: spatialrust-search-graph-meta
            args: -p spatialrust --features search-graph
          - name: spatialrust-filter-voxel
            args: -p spatialrust-filtering --features filter-voxel
          - name: spatialrust-filter-outlier
            args: -p spatialrust-filtering --features filter-outlier
          - name: spatialrust-filter-outlier-meta
            args: -p spatialrust --features filter-outlier
          - name: spatialrust-filter-crop
            args: -p spatialrust-filtering --features filter-crop
          - name: spatialrust-filter-crop-meta
            args: -p spatialrust --features filter-crop
          - name: spatialrust-filter-mls
            args: -p spatialrust-filtering --features filter-mls
          - name: spatialrust-filter-mls-meta
            args: -p spatialrust --features filter-mls
          - name: spatialrust-filter-fps
            args: -p spatialrust-filtering --features filter-fps
          - name: spatialrust-filter-fps-meta
            args: -p spatialrust --features filter-fps
          - name: spatialrust-features-normal
            args: -p spatialrust-features --features feature-normal
          - name: spatialrust-features-iss
            args: -p spatialrust-features --features feature-iss
          - name: spatialrust-features-iss-meta
            args: -p spatialrust --features feature-iss
          - name: spatialrust-features-normal-orient
            args: -p spatialrust-features --features feature-normal-orient
          - name: spatialrust-features-normal-orient-meta
            args: -p spatialrust --features feature-normal-orient
          - name: spatialrust-features-boundary
            args: -p spatialrust-features --features feature-boundary
          - name: spatialrust-features-boundary-meta
            args: -p spatialrust --features feature-boundary
          - name: spatialrust-features-normal-gpu
            args: -p spatialrust-features --features feature-normal-gpu
          - name: spatialrust-features-normal-gpu-meta
            args: -p spatialrust --features feature-normal-gpu
          - name: spatialrust-segmentation
            args: -p spatialrust-segmentation --all-features
          - name: spatialrust-segmentation-dbscan-meta
            args: -p spatialrust --features segment-dbscan
          - name: spatialrust-segmentation-multi-plane-meta
            args: -p spatialrust --features segment-multi-plane
          - name: spatialrust-segmentation-ransac-primitives-meta
            args: -p spatialrust --features segment-ransac-primitives
          - name: spatialrust-segmentation-ground-meta
            args: -p spatialrust --features segment-ground
          - name: spatialrust-segmentation-region-growing-meta
            args: -p spatialrust --features segment-region-growing
          - name: spatialrust-registration-icp
            args: -p spatialrust-registration --features register-icp
          - name: spatialrust-registration-point-to-plane
            args: -p spatialrust-registration --features register-icp-point-to-plane
          - name: spatialrust-registration-point-to-plane-meta
            args: -p spatialrust --features register-icp-point-to-plane
          - name: spatialrust-registration-gicp
            args: -p spatialrust-registration --features register-gicp
          - name: spatialrust-registration-gicp-meta
            args: -p spatialrust --features register-gicp
          - name: spatialrust-registration-gicp-gpu
            args: -p spatialrust-registration --features register-gicp-gpu
          - name: spatialrust-registration-gicp-gpu-meta
            args: -p spatialrust --features register-gicp-gpu
          - name: spatialrust-registration-ndt
            args: -p spatialrust-registration --features register-ndt
          - name: spatialrust-registration-ndt-meta
            args: -p spatialrust --features register-ndt
          - name: spatialrust-registration-fpfh
            args: -p spatialrust-registration --features register-fpfh
          - name: spatialrust-registration-fpfh-meta
            args: -p spatialrust --features register-fpfh
          - name: spatialrust-metrics
            args: -p spatialrust-metrics --features metrics-distance
          - name: spatialrust-metrics-meta
            args: -p spatialrust --features metrics-distance
          - name: spatialrust-transform
            args: -p spatialrust-transform --features transform-ops
          - name: spatialrust-transform-meta
            args: -p spatialrust --features transform-ops
          - name: spatialrust-voxelize
            args: -p spatialrust-voxelize --features voxelize-occupancy
          - name: spatialrust-voxelize-meta
            args: -p spatialrust --features voxelize-occupancy
          - name: spatialrust-voxelize-range-image
            args: -p spatialrust-voxelize --features voxelize-range-image
          - name: spatialrust-voxelize-range-image-meta
            args: -p spatialrust --features voxelize-range-image
          - name: spatialrust-pipeline-mvp
            args: -p spatialrust-pipeline --features pipeline-mvp
          - name: spatialrust-pipeline-mvp-gpu
            args: -p spatialrust-pipeline --features pipeline-mvp,pipeline-mvp-gpu
          - name: spatialrust-mvp
            args: -p spatialrust --features io-pcd,filter-voxel
          - name: spatialrust-mvp-normals
            args: -p spatialrust --features io-pcd,filter-voxel,feature-normal,search-kdtree
          - name: spatialrust-mvp-segmentation
            args: -p spatialrust --features io-pcd,filter-voxel,feature-normal,search-kdtree,segment-ransac-plane,segment-euclidean
          - name: spatialrust-mvp-registration
            args: -p spatialrust --features io-pcd,filter-voxel,register-icp,search-kdtree
          - name: spatialrust-mvp-full
            args: -p spatialrust --features mvp
          - name: spatialrust-io-ply
            args: -p spatialrust-io --features io-ply
          - name: spatialrust-io-ply-meta
            args: -p spatialrust --features io-ply
          - name: spatialrust-io-las
            args: -p spatialrust-io --features io-las
          - name: spatialrust-io-las-meta
            args: -p spatialrust --features io-las
          - name: spatialrust-io-laz
            args: -p spatialrust-io --features io-laz
          - name: spatialrust-io-laz-meta
            args: -p spatialrust --features io-laz
          - name: spatialrust-io-e57
            args: -p spatialrust-io --features io-e57
          - name: spatialrust-io-e57-meta
            args: -p spatialrust --features io-e57
          - name: spatialrust-io-copc
            args: -p spatialrust-io --features io-copc
          - name: spatialrust-io-copc-meta
            args: -p spatialrust --features io-copc
          - name: spatialrust-io-copc-http
            args: -p spatialrust-io --features io-copc-http
          - name: spatialrust-io-copc-http-meta
            args: -p spatialrust --features io-copc-http
          - name: spatialrust-io-copc-http-local
            args: -p spatialrust-io --features io-copc-http --test copc_http_local
          - name: spatialrust-mvp-http
            args: -p spatialrust --features mvp,mvp-http --test mvp_http_copc_cli
          - name: spatialrust-mvp-gpu-integration
            args: -p spatialrust --features mvp,pipeline-mvp-gpu --test mvp_pipeline
          - name: spatialrust-gpu-wgpu
            args: -p spatialrust --features gpu-wgpu
          - name: spatialrust-gpu-crate
            args: -p spatialrust-gpu --features gpu-wgpu
          - name: spatialrust-filter-voxel-gpu
            args: -p spatialrust-filtering --features filter-voxel-gpu
          - name: spatialrust-filter-voxel-gpu-meta
            args: -p spatialrust --features filter-voxel-gpu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and test
        run: |
          case "${{ matrix.name }}" in
            spatialrust-gpu-crate|spatialrust-filter-voxel-gpu|spatialrust-mvp-gpu-integration)
              cargo test ${{ matrix.args }} --no-run
              ;;
            *)
              cargo test ${{ matrix.args }}
              ;;
          esac

          case "${{ matrix.args }}" in
            *"--test"*)
              ;;
            *)
              cargo test --doc ${{ matrix.args }}
              ;;
          esac

  python-bindings:
    name: Python bindings (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build extension and run binding tests
        # maturin develop needs an active virtualenv. The abi3 wheel targets
        # 3.8+, so running on both 3.8 and current proves the forward-compatible
        # ABI actually imports and the NumPy <-> Rust boundary works end to end.
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy mypy "anywidget>=0.9,<0.10" nbclient nbformat ipykernel hatchling
          maturin develop --release --manifest-path crates/spatialrust-py/Cargo.toml
          pip install --no-deps -e python/spatialrust-jupyter
          python crates/spatialrust-py/examples/video_tracking_e2e.py --no-gif
          pytest crates/spatialrust-py/tests
          pytest python/spatialrust-jupyter/tests
          # The comparison report contract stays stdlib-only. OpenCV itself is
          # intentionally not a production or default-CI dependency.
          python bench/opencv_comparison/test_report.py
          # Fail the build if the .pyi type stubs drift from the runtime API.
          python -m mypy.stubtest spatialrust --ignore-missing-stub \
            --allowlist crates/spatialrust-py/stubtest_allowlist.txt \
            --ignore-unused-allowlist

  vision-platform-conformance:
    name: Vision conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test stable image, camera, and vision surface
        run: |
          cargo test -p spatialrust-image
          cargo test -p spatialrust-camera
          cargo test -p spatialrust-vision --no-default-features --features full
          cargo test -p spatialrust-platform vision1
          cargo test -p spatialrust-platform vision2
          cargo test -p spatialrust --no-default-features --features platform,camera-rgbd,vision-full --test vision_api_v1
          cargo run -p spatialrust --no-default-features --features vision-full --example vision_1_cpu
          cargo run -p spatialrust --no-default-features --features platform --example vision_1_release_gate
          cargo run -p spatialrust --no-default-features --features platform --example vision_2_release_gate
          cargo run -p spatialrust --no-default-features --features image-io-standard,vision-video --example video_tracking_e2e

  streaming-platform-conformance:
    name: Streaming 1.2 conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test bounded-streaming contracts and release gate
        run: |
          cargo test -p spatialrust-records --features receipt-json
          cargo test -p spatialrust-io --no-default-features --features io-pcd,io-ply,io-las,io-laz,io-copc-http,streaming
          cargo test -p spatialrust-pipeline --no-default-features --features pipeline-streaming
          cargo test -p spatialrust --no-default-features --features streaming-cli --test streaming_cli
          cargo test -p spatialrust-platform streaming
          cargo run -p spatialrust --no-default-features --features platform,pipeline-streaming --example streaming_1_2_release_gate

  visual-platform-conformance:
    name: Visual conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux software Vulkan adapter
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libvulkan1 mesa-vulkan-drivers
      - name: Test Visual contracts, strict image, viewer, and LOD
        run: |
          cargo test -p spatialrust-viz
          cargo test -p spatialrust-render-wgpu --features wgpu
          cargo test -p spatialrust-viewer --all-features
          cargo test -p spatialrust-lod --all-features
          cargo test -p spatialrust-platform visual
          cargo run -p spatialrust --no-default-features --features render-wgpu --example visual_headless_conformance
          cargo run -p spatialrust --no-default-features --features platform --example visual_release_gate

  visual-web-conformance:
    name: Visual Web/WASM browser conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build WebGPU and browser WASM surfaces
        run: |
          cargo check -p spatialrust-web --target wasm32-unknown-unknown --features wasm,webgpu
          cargo build -p spatialrust-web --target wasm32-unknown-unknown --features wasm
          cargo install wasm-bindgen-cli --version 0.2.126 --locked
          wasm-bindgen \
            --target web \
            --out-dir crates/spatialrust-web/web/pkg \
            target/wasm32-unknown-unknown/debug/spatialrust_web.wasm
      - name: Run real headless-browser smoke
        run: |
          set -euo pipefail
          python -m http.server 8765 --directory crates/spatialrust-web/web >browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8765/browser_smoke.html >/dev/null; then
              break
            fi
            sleep 1
          done
          google-chrome \
            --headless=new \
            --no-sandbox \
            --enable-unsafe-webgpu \
            --use-angle=swiftshader \
            --enable-features=Vulkan \
            --virtual-time-budget=15000 \
            --dump-dom \
            http://127.0.0.1:8765/browser_smoke.html >browser-smoke-dom.txt
          grep -F "SpatialRust Web viewer smoke: PASS" browser-smoke-dom.txt

  bench:
    name: Benchmark compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo bench --workspace --no-run
          cargo bench -p spatialrust-gpu --features gpu-wgpu --no-run
          cargo bench -p spatialrust-filtering --features filter-voxel-gpu --no-run
          cargo bench -p spatialrust-pipeline --features pipeline-mvp-gpu --bench mvp_xyzinormal_approximate_auto --no-run
          cargo bench -p spatialrust-features --features feature-normal-gpu --bench normals --no-run
          cargo bench -p spatialrust-registration --features register-icp,register-icp-point-to-plane,register-gicp,register-ndt --bench registration --no-run
          cargo bench -p spatialrust-registration --features register-icp,register-icp-point-to-plane,register-gicp,register-gicp-gpu,register-ndt --bench registration --no-run

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --all-features

  unsafe-audit:
    name: Unsafe audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect unexpected unsafe usage
        run: |
          set -euo pipefail
          grep -R -n -E '#!\[(deny|allow|warn)\(unsafe_code\)\]' crates
          if grep -R -n -w unsafe crates/spatialrust-core crates/spatialrust-math crates/spatialrust-io crates/spatialrust/src; then
            echo "Unexpected unsafe usage in audited crates"
            exit 1
          fi
          echo "Unsafe audit passed"
